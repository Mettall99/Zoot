services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: zooot
      POSTGRES_PASSWORD: zooot
      POSTGRES_DB: zooot
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  backend-api:
    image: node:22
    working_dir: /app
    volumes:
      - ../backend-api:/app
      - /etc/zooot/wireguard/clients:/app/runtime/wireguard/clients:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "npm install && npm run db:migrate && npm run db:seed && npm run dev"
    environment:
      DATABASE_URL: postgres://zooot:zooot@postgres:5432/zooot
      REDIS_URL: redis://redis:6379
      PORT: 8080
      JWT_SECRET: dev-secret
      JWT_REFRESH_SECRET: dev-refresh
      WIREGUARD_PROVISIONING_ENABLED: "true"
      WIREGUARD_PROVISIONING_MODE: agent
      WIREGUARD_AGENT_URL: http://host.docker.internal:9090
      WIREGUARD_AGENT_TOKEN: change-me
      WIREGUARD_CLIENT_CONFIG_PATH: /app/runtime/wireguard/clients/demo.conf
      OUTLINE_API_URL: ${OUTLINE_API_URL:-https://OUTLINE_HOST:OUTLINE_PORT/SECRET_PATH}
      OUTLINE_CERT_SHA256: ${OUTLINE_CERT_SHA256:-change-me-cert-pin}
      VPN_CONFIG_TOKEN_SECRET: ${VPN_CONFIG_TOKEN_SECRET:-change-me-token-hmac-secret}
      VPN_CREDENTIALS_ENCRYPTION_KEY: ${VPN_CREDENTIALS_ENCRYPTION_KEY:-change-me-32-bytes-or-base64}
      VPN_DEFAULT_SERVER_ID: ${VPN_DEFAULT_SERVER_ID:-outline-main-1}
    ports: ["8080:8080"]
    depends_on: [postgres, redis]

volumes:
  pg_data:
